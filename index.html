<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Leo Lu 的个人主页">
  <title>Leo Lu · 个人主页</title>
  <style>
    :root {
      color-scheme: light;
      --text: #1f2328;
      --muted: #59636e;
      --line: #d1d9e0;
      --paper: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
    }

    a { color: inherit; }

    .site-header {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-weight: 650;
      text-decoration: none;
    }

    .nav-link, .text-link {
      text-underline-offset: 4px;
    }

    .nav-link:hover, .text-link:hover {
      color: #0969da;
    }

    a:focus-visible {
      outline: 2px solid #0969da;
      outline-offset: 4px;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 64px 24px 48px;
    }

    section {
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
    }

    .intro {
      padding-top: 0;
      padding-bottom: 40px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(32px, 6vw, 48px);
      line-height: 1.25;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    p { margin: 0 0 12px; }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 19px;
    }

    footer {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 520px) {
      main { padding-top: 44px; }
      .lead { font-size: 17px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./">Leo Lu</a>
    <a class="nav-link" href="https://github.com/lxyxw">GitHub</a>
  </header>

  <main>
    <!-- 修改这里：写下你的开场介绍。 -->
    <section class="intro" aria-labelledby="intro-title">
      <p class="eyebrow">PERSONAL HOMEPAGE</p>
      <h1 id="intro-title">你好，我是 Leo Lu。</h1>
      <p class="lead">欢迎来到我的个人主页。这里会逐步记录我的项目、学习笔记，以及一些值得留下的想法。</p>
    </section>

    <section aria-labelledby="projects-title">
      <h2 id="projects-title">项目</h2>
      <p>项目内容正在整理。你也可以先到我的 GitHub 查看公开仓库。</p>
      <a class="text-link" href="https://github.com/lxyxw?tab=repositories">访问 @lxyxw 的 GitHub 仓库</a>
    </section>

    <section aria-labelledby="about-title">
      <h2 id="about-title">关于这个页面</h2>
      <p>这是一个使用 HTML 和 CSS 编写的静态网页，由 GitHub Pages 免费托管。所有内容都保存在 index.html 中，简单、直接，也方便继续修改。</p>
    </section>
  </main>

  <footer>© 2026 Leo Lu · Powered by GitHub Pages</footer>
</body>
</html>
